# 品牌
avatar_initial: ""            # 头像圆里的字，留空取站点标题首字
tagline: 笔记、杂谈和碎碎念      # 站名下的斜体小字

# 静态资源版本号：每次改 theme.css / theme.js 后 +1
# GitHub Pages 有 CDN 缓存，不换版本号访客可能看到旧样式
asset_version: 3

# 顶部药丸导航
nav:
  - label: 文章
    url: /
  - label: 归档
    url: /archives/
  - label: 标签
    url: /tags/
  - label: 分类
    url: /categories/
  - label: 留言
    url: /guestbook/
  - label: 关于我
    url: /about/
  - label: 写文章
    url: /admin/

# 首页引言（每行一条，留空则不显示）
intro_lines:
  - 笔记、杂谈和碎碎念
  - 欢迎通过 GitHub 或邮箱交流

# 社交图标：github / mail / rss（留空则不显示该项）
social:
  github: https://github.com/Alexander-ap
  mail: "mailto:1713698517@qq.com"
  rss: /atom.xml

# 联系方式（页脚「写信给我」与关于页共用）
contact:
  email: 1713698517@qq.com

# 访问统计：不蒜子（唯一第三方脚本，无 Cookie，数据公开）
# 设为 false 即整块不注入
analytics:
  busuanzi: true

# 首页是否显示分类标签
show_category_chips: true

# 页脚
city: 大连                    # 显示在文章末尾「写于 2026.11.01 · 大连」

# 首页是否显示标签筛选行
show_tag_chips: true

# giscus 评论（https://giscus.app）
# repo_id / category_id 留空则整块不渲染，站点不会出现空框
# 取值步骤见 README：仓库开启 Discussions → 装 giscus App → 建 Comments 分类 → giscus.app 生成
giscus:
  repo: Alexander-ap/Alexander-ap.github.io
  repo_id: ''
  category: Comments
  category_id: ''
  mapping: pathname          # pathname / og:title / url
  reactions: '1'
  theme: /css/giscus-paper.css   # 指向本地暖纸配色；以 / 开头会自动转成绝对地址
  lang: zh-CN
