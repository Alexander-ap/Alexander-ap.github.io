# ===========================================================
#  NexT 主题配置（Hexo 8 + NexT 8.29）
#  这里只写「覆盖项」，没写的都沿用主题默认值
#  参考：https://theme-next.js.org/docs/
# ===========================================================

# ---------- 外观 ----------
# Muse / Mist / Pisces / Gemini
scheme: Pisces

# 站点图标（用矢量图，避免依赖 PNG 二进制）
favicon:
  small: /images/favicon.svg
  medium: /images/favicon.svg
  apple_touch_icon: /images/favicon.svg
  safari_pinned_tab: /images/favicon.svg

# ---------- 菜单 ----------
# 格式：路径 || 图标（NexT 8 用 Font Awesome 5 写法）
menu:
  home: / || fa fa-home
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-th
  archives: /archives/ || fa fa-archive

# 侧栏位置（Pisces 默认左侧）
sidebar:
  position: left

# ---------- 阅读体验 ----------
reading_progress:
  enable: true
  position: top
  color: '#222'
  height: 2px

back2top:
  enable: true
  sidebar: false
  scrollpercent: true

bookmark:
  enable: false
  color: '#222'
  save: auto

# ---------- 代码块 ----------
codeblock:
  highlight_theme: night bright
  copy_button:
    enable: true
    show_result: true
    style: mac

# ---------- 中英文之间自动加空格 ----------
pangu: true

# ---------- 全站搜索 ----------
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 5
  unescape: false
  preload: false

# ---------- 页脚 ----------
footer:
  since: 2026
  icon:
    name: ''
    animated: false
  powered: true
  theme:
    enable: false
